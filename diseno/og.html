<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url("../public/fonts/montserrat.woff");font-weight:100 900}

.dom{position:absolute;left:70px;bottom:34px;font-weight:600;font-size:19px;letter-spacing:.08em;color:#bbb}
.linea{position:absolute;left:0;bottom:0;width:100%;height:8px;background:#5E7F46}

<div class="foto"></div>
<div class="in">
